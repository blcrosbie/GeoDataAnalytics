# Lab copy of the central warehouse (same image + schema as ../../warehouse).
# For the shared Hetzner instance use warehouse/docker-compose.yml instead.
services:
  postgres:
    build:
      context: ../../warehouse/docker
    image: geo-warehouse:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geodata}
      POSTGRES_USER: ${POSTGRES_USER:-geoagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      LAKE_S3_KEY_ID: ${LAKE_S3_KEY_ID:-}
      LAKE_S3_SECRET: ${LAKE_S3_SECRET:-}
      LAKE_S3_REGION: ${LAKE_S3_REGION:-us-central-1}
      LAKE_S3_ENDPOINT: ${LAKE_S3_ENDPOINT:-s3.us-central-1.wasabisys.com}
      LAKE_BUCKET: ${LAKE_BUCKET:-}
    command: >
      postgres
      -c shared_preload_libraries=pg_duckdb
      -c duckdb.postgres_role=geo_reader
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ${INIT_DB_DIR:-../../warehouse/init-db}:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
