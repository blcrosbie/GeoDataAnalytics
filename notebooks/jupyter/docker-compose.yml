services:
  jupyter:
    image: jupyter/datascience-notebook:latest
    restart: unless-stopped
    # Local-only. Not meant to be hosted; reach it over an SSH tunnel if it runs on a server.
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-changeme}
      NB_UID: ${NB_UID:-1000}
      NB_GID: ${NB_GID:-100}
      TZ: ${TZ:-UTC}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-16}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-16}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-16}
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-prefer}
      POSTGRES_SSL_CERT: ${POSTGRES_SSL_CERT:-}
      POSTGRES_SSL_KEY: ${POSTGRES_SSL_KEY:-}
      POSTGRES_SSL_CA: ${POSTGRES_SSL_CA:-}
    volumes:
      - ${JUPYTER_WORKDIR:-./workspace}:/home/jovyan/work
      - ${DATA_DIR:-../../data}:/home/jovyan/data
      - ./requirements.txt:/home/jovyan/requirements.txt
      - ../../scripts:/home/jovyan/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    command: >
      bash -c "pip install -r /home/jovyan/requirements.txt && 
      start-notebook.py
      --ServerApp.root_dir=/home/jovyan
      --ServerApp.ip=0.0.0.0
      --ServerApp.port=8888"
