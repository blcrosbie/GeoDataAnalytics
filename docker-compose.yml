services:
  postgres:
    # Official PostGIS image includes PostGIS and usually H3/SFCGAL
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - geoagent_db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
      - ./install-extensions.sh:/docker-entrypoint-initdb.d/install-extensions.sh
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y postgresql-16-postgis-3 postgresql-16-h3 &&
      docker-entrypoint.sh postgres
      "

volumes:
  geoagent_db_data: