version: '3.8'

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: geodata_postgres
    environment:
      POSTGRES_DB: geodata_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
      - ./data:/data
    networks:
      - geodata_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geodata_analytics"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: geodata_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - geodata_network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: geodata_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - geodata_network
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: geodata_jupyter
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "geodata"
    ports:
      - "8888:8888"
    volumes:
      - ./python:/home/jovyan/work
      - ./data:/home/jovyan/data
      - ./reports:/home/jovyan/reports
    networks:
      - geodata_network
    restart: unless-stopped
    command: start-notebook.sh --NotebookApp.token='geodata'

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  geodata_network:
    driver: bridge