version: '3.8'

services:
  postgres_master:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: geodata_postgres_master
    environment:
      POSTGRES_DB: geodata_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
      - ./docker/postgres/postgresql_prod.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba_prod.conf:/etc/postgresql/pg_hba.conf
    networks:
      - geodata_prod_network
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  postgres_replica:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: geodata_postgres_replica
    environment:
      POSTGRES_DB: geodata_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: postgres
      POSTGRES_MASTER_SERVICE: postgres_master
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - geodata_prod_network
    restart: unless-stopped
    depends_on:
      - postgres_master

  redis_cluster:
    image: redis:7-alpine
    container_name: geodata_redis_cluster
    ports:
      - "6379:6379"
    volumes:
      - redis_cluster_data:/data
      - ./docker/redis/redis_prod.conf:/usr/local/etc/redis/redis.conf
    networks:
      - geodata_prod_network
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf

  nginx:
    image: nginx:alpine
    container_name: geodata_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx_prod.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./reports:/usr/share/nginx/html/reports
    networks:
      - geodata_prod_network
    restart: unless-stopped
    depends_on:
      - postgres_master

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geodata_app
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres_master:5432/geodata_analytics
      REDIS_URL: redis://redis_cluster:6379
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    networks:
      - geodata_prod_network
    restart: unless-stopped
    depends_on:
      - postgres_master
      - redis_cluster
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_cluster_data:

networks:
  geodata_prod_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16