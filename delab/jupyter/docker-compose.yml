services:
  jupyter:
    image: jupyter/datascience-notebook:latest
    restart: unless-stopped
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-changeme}
      NB_UID: ${NB_UID:-1000}
      NB_GID: ${NB_GID:-100}
      TZ: ${TZ:-UTC}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-16}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-16}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-16}
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-require}
      POSTGRES_SSL_CERT: ${POSTGRES_SSL_CERT:-}
      POSTGRES_SSL_KEY: ${POSTGRES_SSL_KEY:-}
      POSTGRES_SSL_CA: ${POSTGRES_SSL_CA:-}
    volumes:
      - ${JUPYTER_WORKDIR:-./workspace}:/home/jovyan/work
      - /home/brandon/dev/blcrosbie/GeoDataAnalytics/data:/home/jovyan/data
      - ./requirements.txt:/home/jovyan/requirements.txt
    shm_size: "2gb"
    command: >
      bash -c "pip install -r /home/jovyan/requirements.txt && 
      start-notebook.py
      --ServerApp.root_dir=/home/jovyan
      --ServerApp.allow_remote_access=True
      --ServerApp.ip=0.0.0.0
      --ServerApp.port=8888
      --ServerApp.base_url=${JUPYTER_BASE_URL:-/}"
    networks:
      - delab

networks:
  delab:
    name: delab
    external: true
