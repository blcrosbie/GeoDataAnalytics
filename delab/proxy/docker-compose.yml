services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      JUPYTER_UPSTREAM: ${JUPYTER_UPSTREAM:-jupyter}
      JUPYTER_PORT: ${JUPYTER_PORT:-8888}
      NGINX_TEMPLATE: ${NGINX_TEMPLATE:-https.conf.template}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - delab

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

networks:
  delab:
    name: delab
    external: true
